name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight test dependencies
        # numpy unpinned here: requirements.txt caps it at <3, so pip resolves
        # the same 2.x series the runtime installs.
        # fastapi + python-multipart: tests import parakeet_service.routes.
        # pyyaml: config.py reads the model catalog (models.yaml) at import.
        run: python -m pip install --upgrade pip numpy pytest pytest-asyncio psutil fastapi python-multipart pyyaml
      - name: Install ffmpeg
        # The service decodes everything that is not already a 16 kHz PCM WAV
        # through ffmpeg, so tests/test_audio.py cannot cover that path
        # without it. Not present in the runner image.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Compile service
        run: python -m compileall -q parakeet_service server.py
      - name: Run unit tests
        run: pytest -q tests

  onnx-asr-contract:
    # The unit job stubs onnx-asr and onnxruntime. model._build_asr leans on
    # onnx-asr internals, so check them against the real packages, at the
    # versions requirements.txt pins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install onnx-asr, onnx and onnxruntime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio psutil fastapi python-multipart pyyaml \
            "$(grep '^onnx-asr' requirements.txt)" "$(grep '^onnx>=' requirements.txt)" \
            "$(grep '^onnxruntime-gpu' requirements.txt | sed 's/-gpu\[[^]]*\]//')"
      - name: Run onnx-asr contract tests
        run: pytest -q tests/test_onnx_asr_contract.py tests/test_model_cache.py
