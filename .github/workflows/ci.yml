name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'stt-api-runners' }}
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pytest pytest-asyncio psutil fastapi python-multipart pyyaml
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Compile service
        run: python -m compileall -q parakeet_service server.py
      - name: Run unit tests
        run: pytest -q tests

  onnx-asr-contract:
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'stt-api-runners' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install onnx-asr, onnx and onnxruntime
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio psutil fastapi python-multipart pyyaml \
            "$(grep '^onnx-asr' requirements.txt)" "$(grep '^onnx>=' requirements.txt)" \
            "$(grep '^onnxruntime-gpu' requirements.txt | sed 's/-gpu\[[^]]*\]//')"
      - name: Install silero-vad with CPU torch
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "$(grep '^silero-vad' requirements.txt)"
      - name: Run contract tests
        run: pytest -q tests/test_onnx_asr_contract.py tests/test_model_cache.py tests/test_silero_contract.py
