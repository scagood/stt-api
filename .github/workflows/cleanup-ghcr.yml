name: Cleanup Untagged Images
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  cleanup:
    name: ghcr.io cleanup action
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
