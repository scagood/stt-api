name: Cleanup Untagged Images
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  cleanup:
    name: ghcr.io cleanup action
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Re-pushes of latest-cpu/latest-gpu, and of a labelled pull request's
      # pr-<number>-cpu/gpu, leave the manifests they replaced untagged.
      # docker.yml deletes the pr-<number>-* tags when the pull request closes.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          delete-untagged: true
