name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # A pull request labelled prerelease also pushes pr-<number>-cpu and
  # pr-<number>-gpu, to try a change on hardware CI doesn't have, and lists
  # them in a section of its description. The label has to exist in the
  # repository; labelling needs triage access, so it is the approval. Taking
  # it off drops the section; closing the pull request deletes the images
  # (delete-pr-images.yml).
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# One group per pull request: a new push cancels the build of the last one,
# and closing it, in delete-pr-images.yml's run of the same group, cancels a
# build that would push after its images are deleted.
# Other labels run nothing, and taking prerelease off only drops the section,
# which a push must not cancel, so neither shares it.
concurrency:
  group: >-
    docker-${{ github.event_name == 'pull_request' &&
    (!github.event.label || (github.event.action == 'labeled' && github.event.label.name == 'prerelease')) &&
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A paths filter on the trigger would also stop a labelled pull request that
  # changes none of these paths from publishing, so the filter is here.
  changes:
    if: >-
      contains(fromJSON('["opened", "synchronize", "reopened"]'), github.event.action) ||
      (github.event.action == 'labeled' && github.event.label.name == 'prerelease')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      image: ${{ steps.files.outputs.image }}
      # A fork's pull request gets a read-only token, so it never pushes. Nor
      # does a closed one, labelled after it closed: nothing would delete it.
      publish: >-
        ${{ contains(github.event.pull_request.labels.*.name, 'prerelease') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.state == 'open' }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files?per_page=100
        run: |
          files=$(gh api --paginate "$FILES" --jq '.[].filename')
          # What the image is made of, plus what the smoke test below loads
          # and the code that loads it.
          if grep -qxE 'Dockerfile\.[^/]+|requirements\.txt|\.github/workflows/docker\.yml|parakeet_service/(models\.yaml|model\.py)' <<< "$files"; then
            echo image=true >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.flavor }})
    needs: changes
    # main and release tags always build. Labelling only adds the push, so it
    # builds only what it publishes.
    if: >-
      ${{ !cancelled() && !failure() && (github.event_name == 'push' ||
      needs.changes.outputs.publish == 'true' ||
      (needs.changes.outputs.image == 'true' && github.event.action != 'labeled')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # How each flavor went, for the prerelease section. The matrix keeps
    # outputs of different names apart.
    outputs:
      cpu: ${{ steps.result.outputs.cpu }}
      gpu: ${{ steps.result.outputs.gpu }}
    env:
      PUSH: ${{ github.event_name == 'push' || needs.changes.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Emulated arm64 costs ~11 minutes, so only published images build it.
          - flavor: cpu
            platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # onnxruntime-gpu has no aarch64 wheels on PyPI
          - flavor: gpu
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7

      - name: Free runner disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, ',')

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile.${{ matrix.flavor }}
          platforms: ${{ matrix.platforms }}
          push: ${{ env.PUSH }}
          # A pull request builds the CPU image for one platform, so it can be
          # loaded into the runner's Docker for the smoke test, and pushed as
          # well when it publishes (BuildKit 0.13+ takes both outputs).
          load: ${{ github.event_name == 'pull_request' && matrix.flavor == 'cpu' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}
          # A pull request cannot restore another's cache, so it only reads.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}', matrix.flavor) || '' }}

      # Start the image as a replica starts: it answers /healthz only once
      # PARAKEET_PRELOAD_MODELS has loaded and run a warm-up inference through
      # ONNX Runtime, and exits if either fails. CI otherwise stubs ONNX
      # Runtime, so this is the one check that a dependency bump still runs a
      # real model. int8 is parakeet-v3's smallest download (~670 MB). The
      # runner has no GPU, so the GPU image is only built.
      - name: Smoke test (load parakeet-v3 int8, run one inference)
        if: github.event_name == 'pull_request' && matrix.flavor == 'cpu'
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          docker run -d --name smoke -p 5092:5092 \
            -e PARAKEET_PRELOAD_MODELS=parakeet-v3:int8 "$IMAGE"
          # Up to 10 minutes: download, load, and the 120 s warm-up bound.
          for _ in $(seq 120); do
            if curl -fs http://127.0.0.1:5092/healthz; then
              docker logs smoke
              exit 0
            fi
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
            sleep 5
          done
          docker logs smoke
          echo "::error::the image never answered /healthz; its logs are above"
          exit 1

      - id: result
        if: always()
        env:
          FLAVOR: ${{ matrix.flavor }}
          STATUS: ${{ job.status }}
        run: echo "$FLAVOR=$STATUS" >> "$GITHUB_OUTPUT"

  # Write what this run pushed into a section of the pull request's
  # description, the way node-packages lists its prereleases. Each run
  # rewrites it, failures included, and taking the label off drops it.
  prerelease:
    needs: [changes, build]
    if: >-
      ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.changes.outputs.publish == 'true' ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'prerelease')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Write the prerelease section onto the pull request
        env:
          ACTION: ${{ github.event.action }}
          CPU: ${{ needs.build.outputs.cpu }}
          GH_TOKEN: ${{ github.token }}
          GPU: ${{ needs.build.outputs.gpu }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE: ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The label can come off while the images build. That run drops the
          # section, so this one must not write it back. Ignoring case, as the
          # expressions that started this run do.
          labels=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if [ "$ACTION" = unlabeled ] || ! grep -qix prerelease <<< "$labels"; then
            .github/scripts/pull-request-section.sh "$GITHUB_REPOSITORY" "$PR_NUMBER" prerelease
            exit 0
          fi

          section="$RUNNER_TEMP/section.md"
          # The backticks below are Markdown, not command substitution.
          # shellcheck disable=SC2016
          {
            echo '### Prerelease images'
            echo
            if [ "$CPU" = success ] || [ "$GPU" = success ]; then
              echo '```bash'
              if [ "$CPU" = success ]; then echo "docker pull $IMAGE-cpu"; fi
              if [ "$GPU" = success ]; then echo "docker pull $IMAGE-gpu"; fi
              echo '```'
              echo
            fi

            # Anything that failed goes after everything that worked. Its tag
            # may hold this commit's broken image, or an older one.
            if [ "$CPU" != success ]; then
              printf -- '- :x: `pr-%s-cpu` failed its build or smoke test, so do not pull it\n' "$PR_NUMBER"
            fi
            if [ "$GPU" != success ]; then
              printf -- '- :x: `pr-%s-gpu` failed to build, so do not pull it\n' "$PR_NUMBER"
            fi
            if [ "$CPU" != success ] || [ "$GPU" != success ]; then echo; fi

            echo 'For `linux/amd64`, rebuilt on each push while the `prerelease` label is on, and deleted when the pull request closes.'
            echo
            printf 'Built from %s &middot; [workflow run](%s)\n' "${HEAD_SHA:0:7}" "$RUN_URL"
          } > "$section"

          .github/scripts/pull-request-section.sh \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" prerelease "$section"
