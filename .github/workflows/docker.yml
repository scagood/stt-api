name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

jobs:
  ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.flavor }})
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: stt-api-runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cpu
            platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
            use_gpu: "false"
          - flavor: gpu
            platforms: linux/amd64
            use_gpu: auto
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: tcp://buildkitd:1234
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Dockerfile.${{ matrix.flavor }}
          platforms: linux/amd64
          load: true
      - name: Smoke test (load parakeet-v3 fp32 and int8, transcribe once)
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
          USE_GPU: ${{ matrix.use_gpu }}
        run: |
          docker run -d --name smoke -p 5092:5092 \
            -v /cache/jobs/huggingface:/app/models \
            -e PARAKEET_USE_GPU="$USE_GPU" \
            -e PARAKEET_PRELOAD_MODELS=parakeet-v3,parakeet-v3:int8 "$IMAGE"
          healthy=false
          for _ in $(seq 180); do
            if curl -fs http://127.0.0.1:5092/healthz; then
              healthy=true
              break
            fi
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
            sleep 5
          done
          echo
          if [ "$healthy" != true ]; then
            docker logs smoke
            echo "::error::the image never answered /healthz; its logs are above"
            exit 1
          fi
          python3 -c '
          import math, struct, wave
          with wave.open("tone.wav", "wb") as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(22050)
              w.writeframes(b"".join(
                  struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * i / 22050)))
                  for i in range(2 * 22050)
              ))
          '
          if ! curl -fsS --max-time 120 http://127.0.0.1:5092/v1/audio/transcriptions \
              -F file=@tone.wav -F model=parakeet-v3; then
            docker logs smoke
            echo "::error::the transcription request failed; the image's logs are above"
            exit 1
          fi
          echo
          docker logs smoke
      - name: Remove the smoke test container
        if: always()
        run: docker rm -f smoke || true
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        if: github.event_name != 'pull_request'
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-${{ matrix.flavor }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: Dockerfile.${{ matrix.flavor }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
